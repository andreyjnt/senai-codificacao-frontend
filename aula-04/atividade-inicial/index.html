<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini loja</title>
</head>

<body>
    <h1>Mini loja</h1>
    <main>
        <section id="produto">
            <h2> produtos</h2>
            <article>

                <img src="assets/iphone.jpg"
                    alt="Smartphone laranja, com três câmeras traseiras, ao lado da tela preta com linhas abstratas em tons de laranja."
                    width="250" height="250" loading="lazy">
            </article>

            <article>
                <h3>Camiseta</h3>

                <figure>

                    <img src="assets/camisa.jpg"
                        alt="Camiseta branca de manga curta e gola redonda, apresentada sobre fundo branco." width="250"
                        height="250" loading="lazy">
                    <figcaption>Camiseta branca - R$ 59,90</figcaption>
                </figure>
            </article>
            <!-- Quando o caminho ficou errado, apareceu o ícone de imagem quebrada e apenas o texto do atributo alt. -->
        </section>

        <section>
            <h2>Vídeo do produto</h2>

            <video controls width="400" preload="metadata">
                <source src="assets/video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </section>
        <h2>Descrição em audio</h2>
        <audio controls preload="metadata">
            <source src="img/descricao-produto.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
        </section>

        <section>
            <h2>Conteúdo externo</h2>

            <iframe src="https://www.youtube.com/embed/W1zgen5kW-4" width="400" height="225"
                title="Vídeo externo sobre tecnologia" loading="lazy" allowfullscreen>
            </iframe>
        </section>


        <footer>
            <p>Desenvolvido por: Andrey Jonathan e Isabele Oliveira</p>
        </footer>






    </main>
</body>

</html>
